name: Android arm64 CPU executable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - name: Cross-compile standalone arm64 executable
        run: |
          cmake -S . -B build/android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF
          cmake --build build/android-arm64 --parallel 2
          file build/android-arm64/hfs_bench
      - name: Upload Android executable
        uses: actions/upload-artifact@v4
        with:
          name: hfs-bench-android-arm64
          path: build/android-arm64/hfs_bench
          if-no-files-found: error
          retention-days: 14
